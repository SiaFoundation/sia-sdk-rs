language = "C"
header = """// C interface to the sia_storage Rust crate.
//
// Generated by cbindgen from sia_storage_cabi. Do not edit by hand. Run this
// from the workspace root after changing an entry point, and commit the
// result; a test regenerates it and fails if the committed copy differs:
//
//     cbindgen sia_storage_cabi -o sia_storage_cabi/include/sia_storage.h
//
// Conventions:
//   - Fallible functions return an int32_t status code (SIA_OK on success)
//     and set *err to a heap-allocated message on failure. Free it with
//     sia_string_free.
//   - Handles are opaque pointers owned by the caller and released with the
//     matching *_free function.
//   - Passing a null handle is reported rather than dereferenced. A fallible
//     function returns SIA_ERR_INVALID_HANDLE without setting *err; a getter
//     returns a zero value (0, false, or NULL); a void function does nothing.
//     A *_free function accepts null and does nothing, as free(3) does.
//     Non-null handles must still be live: this catches a missing handle, not
//     a dangling one. Out parameters are not checked; they are written only on
//     success, and passing a null one is undefined.
//   - Blocking functions accept an optional sia_cancel_t. Cancelling the
//     token unblocks the call with SIA_ERR_CANCELLED.
//   - Threading: every handle may be moved between threads freely. Whether it
//     may be used from two at once is what the pointer's constness says. A
//     call taking a const handle may run concurrently with other const calls
//     on the same handle; a call taking a non-const one needs exclusive use of
//     it, so serialise those yourself. sia_cancel_cancel is const for exactly
//     this reason: cancelling from another thread is how a blocked call is
//     meant to be unblocked.
//   - Timestamps are Unix microseconds (UTC).
//   - A parameter declared as a pointer to bytes with a fixed width, such as
//     an id or a key, is documented with that width on the function."""
include_guard = "SIA_STORAGE_H"
cpp_compat = true
documentation = true
documentation_style = "c99"
style = "type"
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
line_length = 100
tab_width = 4
usize_is_size_t = false

# The handle types come from sia_storage and tokio_util, so cbindgen sees them
# referenced but never declared. Declaring them here rather than setting
# parse_deps keeps those crates' Rust documentation out of a C header: parsing
# them emits the same opaque typedefs, but drags each type's doc comment along,
# and CancellationToken alone brings forty lines of prose and a tokio example.
after_includes = """

typedef struct sia_sdk sia_sdk_t;
typedef struct sia_shared_sdk sia_shared_sdk_t;
typedef struct sia_object sia_object_t;
typedef struct sia_cancel sia_cancel_t;
typedef struct sia_sharing_key sia_sharing_key_t;
"""

[parse]
parse_deps = false

[export.rename]
# Foreign handles, declared opaque above.
"Object" = "sia_object_t"
"Sdk" = "sia_sdk_t"
"SharedSdk" = "sia_shared_sdk_t"
"SharingKey" = "sia_sharing_key_t"
"CancellationToken" = "sia_cancel_t"
# Handles this crate owns.
"FfiBuilder" = "sia_builder_t"
"FfiUpload" = "sia_upload_t"
"FfiDownload" = "sia_download_t"
"FfiPacked" = "sia_packed_upload_t"
"FfiEvents" = "sia_events_t"
"FfiKeyRecords" = "sia_key_records_t"
"FfiObjectSummaries" = "sia_object_summaries_t"
"FfiMock" = "sia_mock_t"
# Structs C reads or fills.
"KeyStatsC" = "sia_key_stats_t"
"ObjectSummaryC" = "sia_object_summary_t"
"ShardProgressC" = "sia_shard_progress_t"
"UploadOptionsC" = "sia_upload_options_t"
"DownloadOptionsC" = "sia_download_options_t"
"HostQueryC" = "sia_host_query_t"

[defines]
"feature = mock" = "SIA_STORAGE_MOCK"
