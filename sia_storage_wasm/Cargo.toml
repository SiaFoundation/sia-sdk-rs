[package]
name = "sia_storage_wasm"
version = "0.8.6"
edition = "2024"
repository = "https://github.com/SiaFoundation/sia-sdk-rs"
license = "MIT"
description = "WASM bindings for the Sia storage SDK"
authors = ["The Sia Foundation"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[test]]
name = "webtransport"
path = "tests/webtransport/main.rs"
test = false

[dependencies]
sia_storage = { version = "0.13.7", path = "../sia_storage" }
sia_core = { version = "0.7.0", path = "../sia_core" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
wasm-streams = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["io", "std"] }
web-sys = { version = "0.3", features = ["ReadableStream"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
chrono = "0.4"
hex = "0.4"
tokio = { version = "1", features = ["rt", "io-util", "sync"] }
tokio-util = { version = "0.7", features = ["compat"] }
console_error_panic_hook = "0.1"
log = "0.4"
serde = "1.0.229"
tsify = { version = "0.5", default-features = false, features = ["js"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
sia_storage = { path = "../sia_storage", features = ["mock"] }
bytes = "1.12.1"
console_log = "1"
rand = "0.10.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tokio = { version = "1.53.1", features = ["macros"] }
wasm-bindgen-test = "0.3"
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
base64 = "0.23.0"
blake2b_simd = "1.0.4"
bytes = "1.12.1"
rand = "0.10.2"
rcgen = "0.14.10"
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
wtransport = { version = "0.7.2", features = ["quinn"] }
