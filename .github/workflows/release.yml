name: Release

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: write
  actions: write


jobs:
  release:
    if: github.head_ref == 'release' && github.event.pull_request.merged == true
    runs-on: tenki-standard-medium-4c-8g
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - name: Setup Environment
        run: |
          rustup update stable
          cargo install knope
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: knope release
      - name: Publish Crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_API_KEY }}
        run: |
          for crate in sia_core_derive sia_core sia_mux sia_storage; do
            output=$(cargo publish -p "$crate" --registry crates-io 2>&1) && {
              echo "Published $crate"
            } || {
              if echo "$output" | grep -q "already exists"; then
                echo "Skipping $crate (already published)"
              else
                echo "$output" >&2
                exit 1
              fi
            }
          done

      - name: Update sia-storage-js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --tags --quiet
          tag=$(git tag --points-at HEAD --list 'sia_storage_napi/v*' | sort -V | tail -1)
          if [ -z "$tag" ]; then
            tag=$(git tag --points-at HEAD --list 'sia_storage_wasm/v*' | sort -V | tail -1)
          fi
          if [ -z "$tag" ]; then
            echo "No sia_storage_napi or sia_storage_wasm tag on this commit; nothing to update."
            exit 0
          fi
          gh workflow run update-sia-storage-js.lock.yml --ref master -f release_tag="$tag"