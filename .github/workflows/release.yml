name: Release

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    if: github.head_ref == 'release' && github.event.pull_request.merged == true
    runs-on: tenki-standard-medium-4c-8g
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - name: Setup Environment
        run: |
          rustup update stable
          cargo install knope
      # Releases created with GITHUB_TOKEN raise no `release` event, which is
      # what the sia-storage-js / sia-storage-sdk update workflows trigger on.
      # An app token is a real identity, so the event fires.
      - name: Mint bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SIA_CI_BOT_APP_ID }}
          private-key: ${{ secrets.SIA_CI_BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: knope release
      - name: Publish Crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_API_KEY }}
        run: |
          for crate in sia_core_derive sia_core sia_mux sia_storage; do
            output=$(cargo publish -p "$crate" --registry crates-io 2>&1) && {
              echo "Published $crate"
            } || {
              if echo "$output" | grep -q "already exists"; then
                echo "Skipping $crate (already published)"
              else
                echo "$output" >&2
                exit 1
              fi
            }
          done
