[package]
name = "browser_harness"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
sia_core = { path = "../../../sia_core" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
base64 = "0.23.0"
blake2b_simd = "1.0.4"
bytes = "1.12.1"
chrono = "0.4.45"
rand = "0.10.2"
rcgen = "0.14.10"
serde_json = "1.0.151"
sha2 = "0.10.9"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
wtransport = { version = "0.7.2", features = ["quinn"] }
